name: PromptBox

options:
  bundleIdPrefix: com.zrtnb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16"

settingGroups:
  app:
    PRODUCT_BUNDLE_IDENTIFIER: com.zrtnb.promptbox
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  PromptBox:
    type: application
    platform: macOS
    sources:
      - path: Sources/PromptBox
    settings:
      groups: [app]
    info:
      path: Sources/PromptBox/Info.plist
      properties:
        CFBundleName: PromptBox
        CFBundleDisplayName: PromptBox
        CFBundleIdentifier: com.zrtnb.promptbox
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 zrtnb6. MIT License."
        NSUserActivityTypes:
          - com.zrtnb.promptbox.openTemplate
        CFBundleURLTypes:
          - CFBundleURLName: com.zrtnb.promptbox
            CFBundleURLSchemes:
              - promptbox
