name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          chmod +x /tmp/xcodegen/xcodegen/bin/xcodegen
          sudo cp /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project PromptBox.xcodeproj \
            -scheme PromptBox \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package zip
        run: |
          mkdir -p artifacts
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent PromptBox.app "$GITHUB_WORKSPACE/artifacts/PromptBox-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptBox-macos
          path: artifacts/PromptBox-macos.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/PromptBox-macos.zip
          generate_release_notes: true
